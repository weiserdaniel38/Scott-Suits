<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scott's Suits: Offline</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#ECE4DD;color:#221E19;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;margin:0 0 10px;}
  p{margin:0 0 24px;font-size:15px;line-height:1.5;opacity:.75;max-width:320px;}
  button{border:1px solid #B08D57;background:#B08D57;color:#fff;font-size:13px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;padding:14px 28px;cursor:pointer;}
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Scott's Suits needs an internet connection. Check your signal or Wi-Fi and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
