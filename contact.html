<!-- Standalone page (linked from the nav and the site footer). Same inline
     styling approach as privacy.html so none of the designer's layout rules
     apply here. -->
<style>
  :root{--ink:#ECE4DD;--ivory:#221E19;--ivory-dim:rgba(34,30,25,0.62);--brass:#B08D57;--line:rgba(34,30,25,0.14);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--ivory);font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.65;font-size:16px;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 16px 64px;}
  header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px;}
  header a img{width:170px;height:auto;display:block;}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:32px;margin:0 0 6px;}
  .dim{color:var(--ivory-dim);font-size:15px;margin:0 0 28px;}
  a{color:var(--ivory);text-decoration-color:var(--brass);text-underline-offset:3px;}
  .methods{list-style:none;padding:0;margin:0;display:grid;gap:12px;}
  .methods a{display:flex;flex-direction:column;gap:2px;padding:16px 18px;border:1px solid var(--line);text-decoration:none;background:rgba(255,255,255,0.35);}
  .methods a:hover,.methods a:focus-visible{border-color:var(--brass);}
  .label{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;color:var(--brass);}
  .value{font-size:18px;}
  footer{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--ivory-dim);}
</style>
