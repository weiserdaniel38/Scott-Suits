<style>
  .contact-page{max-width:640px;margin:0 auto;padding:64px 32px 88px;}
  .contact-page h1{font-size:40px;line-height:1.15;letter-spacing:-0.01em;}
  .contact-page .lead{color:var(--ivory-dim);font-size:15px;line-height:1.7;}
  .contact-list{list-style:none;margin:36px 0 0;padding:0;border-top:1px solid var(--line);}
  .contact-list li{border-bottom:1px solid var(--line);}
  .contact-list a{display:flex;justify-content:space-between;align-items:center;padding:16px 0;color:var(--ivory);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:500;text-decoration:none;}
  .contact-list a::after{content:"\2192";color:var(--brass);letter-spacing:0;font-size:16px;}
  .contact-list a:hover,.contact-list a:focus-visible{color:var(--brass);}
  .contact-page .back{display:inline-block;margin-top:40px;font-size:13px;color:var(--ivory-dim);text-decoration:none;}
  .contact-page .back:hover{color:var(--brass);}
  .contact-form{margin-top:32px;display:flex;flex-direction:column;gap:16px;}
  .contact-form label{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:500;color:var(--ivory-dim);}
  .contact-form input,.contact-form textarea{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ivory);background:var(--surface,#fff);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%;box-sizing:border-box;}
  .contact-form textarea{min-height:140px;resize:vertical;line-height:1.5;}
  .contact-form input:focus,.contact-form textarea:focus{outline:none;border-color:var(--brass);}
  .contact-form .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
  .contact-form button{align-self:flex-start;background:var(--sw-burgundy,#74444D);color:var(--sw-gold,#fff);border:none;border-radius:999px;padding:14px 32px;font:inherit;font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:500;cursor:pointer;}
  .contact-form button:disabled{opacity:.6;cursor:default;}
  .contact-status{font-size:14px;line-height:1.6;color:var(--ivory-dim);margin:0;}
  .contact-status.ok{color:var(--ivory);}
  .contact-or{margin:36px 0 0;font-size:13px;color:var(--ivory-dim);}
  .contact-or + .contact-list{margin-top:12px;}
  @media(max-width:600px){.contact-form button{align-self:stretch;}}
  @media(max-width:600px){
    .contact-page{padding:40px 16px 64px;}
    .contact-page h1{font-size:30px;}

<script>
// Contact form (2026-11-17): the contact-message edge function emails the
// shop and sends the customer an automatic "we received your message" reply.
(function () {
  var form = document.getElementById("contactForm");
  var btn = document.getElementById("contactSend");
  var status = document.getElementById("contactStatus");
  if (!form) return;
  function say(msg, ok) { status.textContent = msg; status.className = "contact-status" + (ok ? " ok" : ""); }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = form.elements;
    var email = f.email.value.trim();
    var message = f.message.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { say("Please enter a valid email address."); f.email.focus(); return; }
    if (message.length < 2) { say("Please write your message."); f.message.focus(); return; }
    btn.disabled = true;
    btn.textContent = "Sending...";
    say("");
    fetch(SUPABASE_URL + "/functions/v1/contact-message", {
      method: "POST",
      headers: { "content-type": "application/json", apikey: SUPABASE_ANON_KEY, authorization: "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({
        name: f.name.value.trim(),
        email: email,
        message: message,
        website: f.website.value,
        brand: (typeof SITE_BRAND !== "undefined" && SITE_BRAND.id) || "scott",
      }),
    }).then(function (res) {
      if (!res.ok) throw new Error("send failed");
      form.reset();
      say("Thank you. Your message was sent, and a confirmation is on its way to " + email + ".", true);
    }).catch(function () {
      say("We couldn't send your message just now. Please try again, or email us directly below.");
    }).then(function () {
      btn.disabled = false;
      btn.textContent = "Send message";
    });
  });
})();
</script>
