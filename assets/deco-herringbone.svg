<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none">
  <!-- Soft herringbone cloth swell with sweeping thread lines over it. -->
  <defs>
    <pattern id="hb" width="20" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 0 L10 7 L20 0 M0 7 L10 14 L20 7 M0 14 L10 21 L20 14 M0 21 L10 28 L20 21" stroke="#5e4f3c" stroke-width="1.1"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="82%" r="70%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><path d="M640 120 C520 170 430 250 360 360 C300 450 200 520 40 640 L640 640 Z" fill="url(#fade)"/></mask>
    <linearGradient id="swell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#d4c8b6" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <path d="M640 120 C520 170 430 250 360 360 C300 450 200 520 40 640 L640 640 Z" fill="url(#swell)"/>
  <rect width="640" height="640" fill="url(#hb)" mask="url(#m)"/>
  <g stroke="#a88b5c" stroke-width="1">
    <path d="M0 600 C180 520 300 360 420 230 C500 140 580 80 640 50"/>
    <path d="M60 640 C240 560 340 420 460 290 C540 200 600 150 640 130" stroke-opacity="0.7"/>
    <path d="M-20 520 C140 460 250 300 360 170 C440 80 540 20 640 -10" stroke-opacity="0.55"/>
