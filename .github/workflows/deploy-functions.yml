# Deploys Supabase edge functions when a push to main changes them, so big
# functions (generate-suit-image, ~140 KB) no longer need Daniel's PC.
# Needs the repo secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token). Without it the job skips with a notice instead of failing.
# Manual run: Actions > Deploy edge functions > Run workflow, with a
# function name (or "all").
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:
    inputs:
      function:
        description: "Function folder name to deploy, or all"
        required: true
        default: generate-suit-image

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nvlhngzycldysosvhglx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for the access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret not set; nothing deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: 2.122.0
      - name: Pick the functions to deploy
        if: steps.token.outputs.ok == 'true'
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.function }}" = "all" ]; then
              list=$(ls supabase/functions)
            else
              list="${{ inputs.function }}"
            fi
          else
            list=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/functions \
              | cut -d/ -f3 | sort -u)
          fi
          # Only folders that still exist (a deleted function is not deployed).
          out=""
          for f in $list; do [ -f "supabase/functions/$f/index.ts" ] && out="$out $f"; done
          echo "Functions:$out"
          echo "list=$out" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.token.outputs.ok == 'true' && steps.pick.outputs.list != ''
        run: |
          for f in ${{ steps.pick.outputs.list }}; do
            # Every function runs with JWT checks off (they check callers
            # themselves), except scan-voice, which is live with them on.
            flag="--no-verify-jwt"
            [ "$f" = "scan-voice" ] && flag=""
            echo "Deploying $f"
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" $flag --use-api
          done
      - name: Check generate-suit-image answers
        if: steps.token.outputs.ok == 'true' && contains(steps.pick.outputs.list, 'generate-suit-image')
        run: |
          curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/generate-suit-image" \
            -H "Content-Type: application/json" -d '{"ping":true}' | tee /tmp/ping.json
          grep -q '"ok":true' /tmp/ping.json
